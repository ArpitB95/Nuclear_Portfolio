const MENTOR={
"Project Coordinator":["Think CPM — what levers exist before accepting a delay?","CSA N286 Element 6 governs procurement of safety-classified items.","NSCA Section 45 defines reportable events — when in doubt, report.","EVM: SPI or CPI below threshold triggers mandatory management escalation."],
"Systems Engineer":["USQ screening is mandatory when any parameter in the approved safety analysis may change.","Single failure criterion is deterministic — redundancy, not reliability ratings.","Safety classification drives every downstream engineering decision.","Defence-in-depth means independence of barriers."],

const SCENARIOS=[
{id:"pc01",role:"Project Coordinator",title:"Critical Path Delay — Steam Generator",facility:"Bruce Power Unit 6",year:"2022",difficulty:"Hard",description:"Day 12 of a 21-day planned outage. Steam generator ECT reveals 8 additional tubes requiring plugging — 4 hours each — adding 32 hours to the critical path. Liquidated damages apply after Day 21.",context:"Nuclear fatigue rules cap shifts at 12 hours. Three other critical-path activities run in parallel with 4–18 hours of float.",hint:"Think CPM — multiple levers exist before accepting a delay. What does float on parallel activities mean for your options?",options:[{id:"a",text:"Authorize 16-hour shifts to recover 32 hours within 2 days and notify CNSC of the fatigue deviation."},{id:"b",text:"Accept the delay, re-baseline the schedule, and communicate the revised date to management."},{id:"c",text:"Run a schedule recovery workshop: analyse float, evaluate crew augmentation, compress post-SG activities, stay within fatigue limits."},{id:"d",text:"Defer marginal tube plugging to the next outage to save time."}],correct:"c",explanation:"Option C is the correct CPM response. Float analysis, resource augmentation, and activity compression are the right levers before accepting a delay. Nuclear fatigue management is non-negotiable — Option A is a regulatory violation. Option D is a safety decision that cannot be made unilaterally. Option B surrenders without analysis.",skills:["Critical Path Method","Outage Schedule Recovery","Nuclear Fatigue Management","Stakeholder Communication"]},
{id:"pc02",role:"Project Coordinator",title:"Procurement NCR — Safety Panels",facility:"OPG Darlington — MCR Upgrade",year:"2021",difficulty:"Medium",description:"Class 1E instrumentation panels arrive on site. Receiving inspection finds weld records reference an unapproved WPS. Panels needed in 3 days. Visual inspection appears acceptable.",context:"Class 1E panels are safety-related under CSA N286 Element 6. Unapproved WPS is a formal non-conformance regardless of visual appearance.",hint:"What does CSA N286 require when a safety-classified item does not meet procurement requirements?",options:[{id:"a",text:"Accept conditionally based on visual inspection and document as a minor finding."},{id:"b",text:"Place material hold. Issue NCR. Work with supplier to approve WPS retroactively or reject and reorder. Communicate schedule impact."},{id:"c",text:"Return all panels immediately and reorder from another supplier."},{id:"d",text:"Use panels under a temporary operating approval while paperwork is resolved."}],correct:"b",explanation:"NCR and material hold is correct under CSA N286 Elements 6 and 8. Retroactive WPS approval is legitimate if the procedure was technically sound. Option A bypasses safety-related quality controls. Option D is inappropriate for safety-classified items.",skills:["Non-Conformance Reporting","CSA N286 Procurement Control","Supplier Quality Management","Schedule vs Safety Trade-off"]},
{id:"pc03",role:"Project Coordinator",title:"Missed Regulatory Hold Point",facility:"Bruce Power Unit 4 — Refurbishment",year:"2023",difficulty:"Hard",description:"A work crew proceeds past a CNSC regulatory hold point without sign-off during a pressure boundary modification involving Class 2 welding. You discover this 6 hours after completion.",context:"Under NSCA Section 45, proceeding past a hold point is a reportable event. Post-weld NDE shows the weld is structurally sound.",hint:"The work is done. What does NSCA Section 45 require immediately — before considering schedule impact?",options:[{id:"a",text:"Document internally, notify plant manager, report to CNSC at the next compliance meeting."},{id:"b",text:"Notify CNSC immediately per NSCA Section 45. Initiate CAR. Commission independent weld review. Implement controls on remaining hold points."},{id:"c",text:"Since NDE confirms quality, document as minor administrative deviation and continue."},{id:"d",text:"Halt all project work until CNSC completes a full site inspection."}],correct:"b",explanation:"Missing a regulatory hold point is a reportable event regardless of outcome. Immediate CNSC notification is mandatory. The CAR investigates root cause. Option A's deferred reporting is a further violation. Option C trivialises a serious process failure.",skills:["NSCA Section 45 Reporting","Regulatory Hold Point Management","Corrective Action Program","CNSC Communication"]},
{id:"pc04",role:"Project Coordinator",title:"Contractor Scope Creep",facility:"OPG Pickering — Turbine Overhaul",year:"2020",difficulty:"Medium",description:"Contractor submits a $340,000 change order for additional bearing wear — third scope addition in 6 weeks. Contract NTE is $2.1M and you are at $1.9M. The bearing wear is genuine.",context:"The NTE limit is a hard contractual constraint. The pattern of additions suggests poor scoping or scope creep strategy.",hint:"Two issues: technical validity of the change order, and the contractual NTE limit. Which do you address first?",options:[{id:"a",text:"Approve immediately — the technical justification is valid."},{id:"b",text:"Reject — you are within $200K of the NTE limit."},{id:"c",text:"Independently verify findings. Notify contractor of NTE proximity. Escalate to management for amendment approval. Document all scope changes for lessons learned."},{id:"d",text:"Negotiate down to $200K and approve verbally to keep schedule moving."}],correct:"c",explanation:"Option C addresses both dimensions. Three scope additions warrant technical scrutiny. The NTE limit requires management escalation and formal amendment. Verbal approvals (D) create audit risk. Blanket rejection (B) ignores a legitimate safety concern.",skills:["Change Order Management","Contract Administration","Scope Creep Identification","Stakeholder Escalation"]},
{id:"pc05",role:"Project Coordinator",title:"Worker Injury — Delayed Reporting",facility:"Bruce Power Unit 3 — Outage",year:"2022",difficulty:"Medium",description:"A contractor worker suffers a hand laceration in a controlled area and does not report it for 4 hours, citing fear of affecting the outage schedule. The supervisor was also aware and did not report.",context:"Nuclear safety culture requires immediate reporting of all injuries. Delayed reporting masks a cultural issue that could lead to more serious future events.",hint:"This is simultaneously an injury, a reporting failure, and a safety culture indicator. Which is most critical?",options:[{id:"a",text:"Document the injury, issue formal warnings to the worker and supervisor, and continue."},{id:"b",text:"Ensure medical care. Complete all incident reports. Investigate the reporting delay as a safety culture issue. Enter a CAP item on the supervisor's failure to report."},{id:"c",text:"Report only the injury to HR. The reporting delay is the contractor's internal matter."},{id:"d",text:"Halt the crew pending a full safety culture assessment before allowing return to the controlled area."}],correct:"b",explanation:"Medical care and incident reporting are the first priority. The reporting failure is a significant INSAG-13 safety culture finding — fear of schedule impact overriding injury reporting is a serious red flag that must enter the CAP.",skills:["Safety Culture Assessment","Incident Reporting","Corrective Action Program","Contractor Oversight"]},
{id:"pc06",role:"Project Coordinator",title:"EPC Scope Gap — Shielding",facility:"CNL Chalk River — Lab Upgrade",year:"2021",difficulty:"Medium",description:"Six weeks into an EPC contract, engineering identifies the scope did not adequately define shielding for a new isotope storage area. Both owner and contractor claim the other is responsible. Cost: $180,000 and 3 weeks.",context:"The original scope used 'meet all applicable regulatory requirements' without specifying the CNSC REGDOC for shielding design.",hint:"Before assigning costs or blame, what document controls the contractual obligation?",options:[{id:"a",text:"Assign full cost to the contractor — EPC contracts require them to identify all code requirements."},{id:"b",text:"Assign full cost to the owner — the scope was inadequate."},{id:"c",text:"Conduct formal scope gap analysis referencing contract documents, applicable REGDOCs, and bid clarifications. Engage both parties in structured dispute resolution per contract."},{id:"d",text:"Split cost 50/50 to keep the project moving."}],correct:"c",explanation:"Scope disputes require structured resolution against contract documents. The phrase 'applicable regulatory requirements' has specific nuclear meaning tied to CNSC REGDOCs. Formal dispute resolution protects both parties and creates a documented record.",skills:["EPC Contract Administration","Scope Gap Analysis","CNSC REGDOC Compliance","Dispute Resolution"]},
{id:"pc07",role:"Project Coordinator",title:"Resource Conflict — Two Parallel Outages",facility:"OPG Darlington — Units 2 & 3",year:"2023",difficulty:"Hard",description:"Overlapping 5-day outage period. One certified PT inspection crew. Unit 2 is 2 days ahead. Unit 3 is on critical path with no float. A weather event may delay Unit 2 material deliveries 24–48 hours.",context:"PT inspection is a regulatory requirement and cannot be deferred. Mobilising a second crew takes 5 days and costs $85,000.",hint:"You have one certified resource and two regulatory requirements. What information do you need before allocating?",options:[{id:"a",text:"Assign crew to Unit 3 immediately — it has no float."},{id:"b",text:"Keep crew on Unit 2 — it started first and is ahead."},{id:"c",text:"Quantify weather delay probability. Model schedule impact of reallocation. Evaluate $85K second crew against liquidated damages. Present options to senior management."},{id:"d",text:"Mobilise the second crew immediately to eliminate the conflict."}],correct:"c",explanation:"Dual regulatory obligations and financial exposure require structured options analysis before committing. The weather delay may resolve the conflict. The $85K must be weighed against liquidated damages. Senior management must decide as it exceeds the coordinator's financial authority.",skills:["Resource Levelling","Multi-Unit Outage Coordination","Risk Quantification","Escalation Protocol"]},
{id:"pc08",role:"Project Coordinator",title:"EVM Below Threshold — Emergency Generator",facility:"Bruce Power — EDG Installation",year:"2020",difficulty:"Medium",description:"Monthly EVM: BCWP=$1.2M, BCWS=$1.5M, ACWP=$1.45M. SPI=0.80, CPI=0.83. Escalation threshold is below 0.85. The project is a safety-related emergency diesel generator installation.",context:"Schedule variance driven by delayed equipment delivery. Cost variance by additional engineering hours on seismic anchorage design.",hint:"Both indices are below threshold on a safety-related project. What does a credible recovery plan look like?",options:[{id:"a",text:"Report variances to management, identify root causes, propose recovery plan addressing both issues with revised forecast at completion."},{id:"b",text:"Wait one more period — the equipment delivery is expected next week."},{id:"c",text:"Compress remaining schedule with overtime to recover SPI. Address cost next cycle."},{id:"d",text:"Re-baseline the project to reset EVM indices and avoid escalation."}],correct:"a",explanation:"Below-threshold EVM triggers mandatory escalation with no discretion to defer. Re-baselining to avoid escalation is a project controls integrity failure. Addressing only schedule gives an incomplete picture for a safety-classified installation.",skills:["Earned Value Management","Schedule Recovery","Cost Variance Analysis","Safety Project Reporting"]},
{id:"pc09",role:"Project Coordinator",title:"Subcontractor Qualification Lapse",facility:"OPG Pickering — Rad Waste Facility",year:"2022",difficulty:"Medium",description:"Mid-project, you discover a subcontractor's CNSC vendor qualification expired 3 weeks ago. They have been performing concrete work on a radiological waste storage facility. Renewal is expected in 2 weeks.",context:"Work performed by an unqualified vendor is a potential licence condition violation. All inspection hold points passed. The prime contractor was unaware.",hint:"Work has been performed without required qualification. What are your immediate obligations before considering schedule?",options:[{id:"a",text:"Stop work. Notify CNSC of potential licence condition violation. Enter CAP. Commission engineering review of work performed during lapse."},{id:"b",text:"Allow work to continue since renewal is imminent and inspections passed."},{id:"c",text:"Notify the prime contractor — it is their responsibility."},{id:"d",text:"Backdate the qualification renewal to cover the lapse period."}],correct:"a",explanation:"A qualification lapse requires immediate stop-work and CNSC notification. The CAP captures root cause. Engineering review of lapse-period work is required to formally assess acceptability. Option D is falsification of records — a criminal and regulatory offence.",skills:["Vendor Qualification Management","Licence Condition Compliance","Stop-Work Authority","Regulatory Reporting"]},
{id:"pc10",role:"Project Coordinator",title:"Post-Outage Lessons Learned",facility:"Bruce Power Unit 5",year:"2023",difficulty:"Easy",description:"Facilitating the post-outage review for a 19-day outage that completed on Day 22. Primary cause: unplanned SG finding Day 14. 23 open CAP items at closeout — 4 rated Significant. No LTIs.",context:"The session should identify systemic root causes, not just event-level findings.",hint:"What is the difference between a finding and a corrective action in a post-outage context?",options:[{id:"a",text:"Document the delay as caused by the SG finding and close the session."},{id:"b",text:"Analyse each Significant CAP for systemic causes. Review pre-outage risk register. Develop corrective actions with owners and due dates. Share findings with other unit outage teams."},{id:"c",text:"Focus only on the 3-day delay — it is the highest-visibility issue."},{id:"d",text:"Assign all CAPs to relevant contractors since they were responsible."}],correct:"b",explanation:"A session addressing only the headline delay misses systemic findings in the 4 Significant CAPs. Procedure inadequacies and human performance events are leading indicators. Cross-unit sharing multiplies value.",skills:["Post-Outage Lessons Learned","Root Cause Analysis","CAP Closure Management","Continuous Improvement"]},
{id:"se01",role:"Systems Engineer",title:"USQ — ECCS Valve Replacement",facility:"OPG Darlington Unit 2",year:"2021",difficulty:"Hard",description:"Modification proposes replacing an ECCS valve. Replacement Cv=85 vs original Cv=92. TH analysis shows coolant flow during a LOCA would be 4.3% lower than the SAR design basis value.",context:"ECCS performance is tied to the CNSC-approved SAR. Any change affecting a SAR parameter requires formal USQ screening under CSA N286.",hint:"The key question is not whether 4.3% is small — it is whether this change affects any parameter the SAR relied upon.",options:[{id:"a",text:"Sign off — 4.3% is within normal engineering tolerance."},{id:"b",text:"Flag as potential USQ. Require formal USQ screening before proceeding. If confirmed, update safety analysis and obtain CNSC acceptance."},{id:"c",text:"Upsize the valve to restore original Cv, then sign off without USQ screening."},{id:"d",text:"Approve with conditions: add flow instrumentation to monitor ECCS in real-time."}],correct:"b",explanation:"Any modification changing a SAR parameter requires USQ screening under CSA N286 Design Control. A 4.3% reduction is not automatically acceptable — acceptability depends on the margin between as-designed performance and SAR acceptance criteria. Upsizing (C) may resolve the technical issue but USQ screening is still required first.",skills:["USQ Screening","Design Change Control (CSA N286)","ECCS Safety Function","Licensing Basis Management"]},
{id:"se02",role:"Systems Engineer",title:"Post-Seismic Walkdown",facility:"Pickering NGS Unit 4",year:"2020",difficulty:"Medium",description:"Magnitude 4.1 earthquake 40 km from site. PGA=0.04g — below SDE of 0.1g but above the station walkdown trigger of 0.02g. All units tripped automatically. Shift supervisor asks whether Unit 4 can restart.",context:"Station procedures require a full post-seismic walkdown of all safety-related systems before restart following any event exceeding the trigger threshold.",hint:"PGA instruments capture one parameter. Walkdowns exist because instruments cannot verify physical integrity of anchors, supports, and piping.",options:[{id:"a",text:"Confirm PGA is well below SDE and authorize restart — the automatic trip proves the systems functioned."},{id:"b",text:"Complete the full mandatory post-seismic walkdown per procedure. Document all findings and sign off before permitting criticality."},{id:"c",text:"Perform partial walkdown of SDS1 and SDS2 only, then authorize restart."},{id:"d",text:"Declare a nuclear emergency and notify CNSC before anything else."}],correct:"b",explanation:"Post-seismic walkdowns are triggered by threshold exceedance — not SDE comparison. PGA cannot verify physical integrity throughout the facility. Partial walkdowns violate the procedure. A nuclear emergency is not warranted for a below-SDE event with no safety system failures.",skills:["Post-Seismic Walkdown","Seismic Design Basis","Safety System Verification","Procedure Compliance"]},
{id:"se03",role:"Systems Engineer",title:"Safety Classification — Cooling System",facility:"CNL Chalk River",year:"2022",difficulty:"Medium",description:"New cooling system removes decay heat from irradiated targets. Failure would not directly cause criticality but could cause target damage and radioactive material release. Design team proposes Non-Safety.",context:"Classification drives every downstream engineering decision. Misclassification is a common CNSC inspection finding.",hint:"Classification hinges on whether failure could contribute to a radiological release — not just a criticality event.",options:[{id:"a",text:"Accept Non-Safety — the system does not directly prevent criticality."},{id:"b",text:"Classify Safety Special — any system near radioactive material is automatically SS."},{id:"c",text:"Classify Safety Related — the system supports prevention of radioactive material release, which is a safety function. Apply corresponding CSA standards and seismic requirements."},{id:"d",text:"Classify Non-Safety but add redundancy as compensation."}],correct:"c",explanation:"Safety Related applies when system failure could contribute to a radiological release — not necessarily directly cause a nuclear accident. This system's failure pathway leads to target damage and potential release, meeting the SR criterion.",skills:["Safety Classification","Radiological Consequence Assessment","CSA N286 Design Control","CNSC Compliance"]},
{id:"se04",role:"Systems Engineer",title:"AMP — FAC Rate Exceedance",facility:"OPG Darlington Unit 3",year:"2023",difficulty:"Medium",description:"Feeder AMP shows 12 outlet feeders within 15% of minimum acceptable wall thickness. Current inspection interval is 4 years. Actual FAC rates are slightly higher than predicted in the original AMP.",context:"CNSC REGDOC-2.6.3 requires AMPs to demonstrate degradation is managed throughout the operating life. AMP assumptions must be validated against actual data.",hint:"Actual FAC rates exceed predictions. What does this mean for the validity of the current inspection interval?",options:[{id:"a",text:"Maintain 4-year interval — feeders still meet minimum wall thickness."},{id:"b",text:"Revise AMP to reflect updated FAC rates. Perform new FFS assessment to determine if 4-year interval remains valid. Implement enhanced monitoring until complete."},{id:"c",text:"Immediately replace all 12 feeders."},{id:"d",text:"Increase the FFS minimum wall thickness criterion for additional conservatism."}],correct:"b",explanation:"When actual degradation exceeds AMP predictions, the program assumptions are invalidated and a revised FFS assessment is mandatory per REGDOC-2.6.3. Maintaining the interval ignores new data. Increasing the FFS criterion is based on structural mechanics, not operational convenience.",skills:["Aging Management Program","Flow-Accelerated Corrosion","Fitness-for-Service","CNSC REGDOC-2.6.3"]},
{id:"se05",role:"Systems Engineer",title:"Single Failure Criterion — UPS",facility:"Bruce Power Unit 2",year:"2022",difficulty:"Hard",description:"Modification proposes replacing dual redundant Class 1E emergency power trains with a single higher-reliability UPS. Vendor MTBF is 3x each original train. Package claims SFC compliance.",context:"The SFC requires safety systems to perform assuming any single active component fails. Redundancy provides the mechanism — not reliability ratings.",hint:"The SFC is deterministic — it assumes failure WILL occur. Does one unit, however reliable, satisfy this?",options:[{id:"a",text:"Approve — higher MTBF meets the intent of the SFC."},{id:"b",text:"Reject. A single unit cannot satisfy the SFC regardless of reliability. When it fails there is no backup. Dual-train architecture must be maintained."},{id:"c",text:"Approve with conditions: require 10-year reliability guarantee and enhanced testing."},{id:"d",text:"Submit to CNSC for interpretation."}],correct:"b",explanation:"The SFC is deterministic: safety systems must perform assuming any single active component fails. A single UPS has no backup when it fails — by definition it cannot satisfy the SFC. MTBF is probabilistic and does not substitute for deterministic redundancy.",skills:["Single Failure Criterion","Class 1E Electrical Design","Deterministic Safety Analysis","Reliability vs Redundancy"]},
{id:"se06",role:"Systems Engineer",title:"DBD Discrepancy — Heat Transfer",facility:"OPG Darlington Unit 1",year:"2021",difficulty:"Medium",description:"During a modification review, you find the Shutdown Cooling System DBD references a heat exchanger coefficient of 4,200 W/m²K. The original vendor calculation shows 3,850 W/m²K. The DBD value has been used for 11 years.",context:"The DBD is the authoritative source for design parameters. Discrepancies must be resolved — not assumed conservative.",hint:"11 years of use does not validate an incorrect value. What is the engineering obligation when you find an error in a safety basis document?",options:[{id:"a",text:"Use the DBD value — it has been accepted for 11 years."},{id:"b",text:"Initiate a formal document discrepancy report. Determine which value is correct. Assess impact on existing modifications. Update DBD and flag all affected analyses."},{id:"c",text:"Use 3,850 for your current modification only, without raising the discrepancy formally."},{id:"d",text:"Request the vendor to retest the heat exchanger."}],correct:"b",explanation:"Discovering a DBD discrepancy requires formal resolution. 11 years of use means 11 years of potentially affected analyses need review. Informal use of an 'unofficial' conservative value is not acceptable on a nuclear safety system.",skills:["Design Basis Document Management","Engineering Document Control","CSA N286 Design Control","Safety Analysis Impact Assessment"]},
{id:"se07",role:"Systems Engineer",title:"Containment Isolation — Fail Mode",facility:"Bruce Power Unit 6",year:"2023",difficulty:"Hard",description:"Modification changes a containment isolation valve from air-to-close (fail-safe closed) to a motor-operated valve with fail-in-place on loss of power. Package argues MOVs are more reliable.",context:"Containment isolation valves are Safety Special. Design basis requires isolation under all accident conditions, including station blackout.",hint:"What is the required failure mode for a containment isolation valve during loss of Class IV power?",options:[{id:"a",text:"Approve — MOVs are more reliable and this compensates for the changed failure mode."},{id:"b",text:"Reject. Containment isolation valves must close under all accident conditions including blackout. A fail-in-place MOV open during blackout provides no isolation. Fail-safe-to-closed design must be maintained."},{id:"c",text:"Approve with conditions: add battery backup to the MOV actuator."},{id:"d",text:"Request a PRA to demonstrate acceptable failure probability."}],correct:"b",explanation:"Containment isolation valves must achieve the isolated position under all DBAs, including station blackout. A fail-in-place MOV open when power is lost provides no containment isolation — a fundamental violation of the safety function.",skills:["Containment Isolation Design","Fail-Safe Design Principles","Station Blackout Analysis","Safety Special System Requirements"]},
{id:"se08",role:"Systems Engineer",title:"LCO Entry — HPCI Transmitter",facility:"OPG Darlington Unit 4",year:"2022",difficulty:"Medium",description:"One of three redundant HPCI flow transmitters fails low. Tech Specs require 2-of-3 operable. Allowed Outage Time is 7 days. A qualified spare is available. Replacement takes 4 days.",context:"The 2-of-3 logic still allows automatic actuation. The qualified spare has a valid certification.",hint:"You are in an LCO with a 7-day AOT and a 4-day repair path. LCOs are managed conditions — what is the correct response?",options:[{id:"a",text:"Continue operating — 2-of-3 still allows actuation and you have 7 days."},{id:"b",text:"Initiate repair immediately using the qualified spare. Document LCO entry, monitor AOT clock, complete repair within AOT with margin."},{id:"c",text:"Initiate a controlled shutdown to avoid operating in an LCO."},{id:"d",text:"Declare HPCI inoperable and notify CNSC of an immediate safety concern."}],correct:"b",explanation:"An LCO is managed — not ignored and not automatically an emergency. Enter the LCO, document it, initiate repair using the qualified spare, and monitor the clock. Option A is complacent. Shutdown is not required when a feasible repair path exists within AOT.",skills:["Technical Specifications","Limiting Condition for Operation","AOT Management","Operability Assessment"]},
{id:"se09",role:"Systems Engineer",title:"Piping Standard — Rad Waste Transfer",facility:"CNL — Waste Processing Facility",year:"2021",difficulty:"Easy",description:"A new radioactive liquid waste transfer system design spec references ASME B31.1. Waste stream activity: 10⁴ Bq/L. System transfers waste from process tanks to a storage building 80 metres away.",context:"ASME B31.1 is for non-nuclear power piping. The waste stream classification determines which design standard applies.",hint:"The applicable piping standard is determined by safety classification. Does the activity level affect which standard applies?",options:[{id:"a",text:"Accept B31.1 — it is a recognised pressure piping standard."},{id:"b",text:"Review safety classification based on radiological consequences of pipe failure. If SR or SS, ASME Section III or CSA equivalent applies — not B31.1. Request formal classification review."},{id:"c",text:"Apply ASME Section III to all facility piping as a conservative measure."},{id:"d",text:"Request written justification for B31.1 and accept if rationale is provided."}],correct:"b",explanation:"The applicable piping standard is determined by safety classification, driven by radiological consequences of failure. ASME B31.1 is not acceptable for safety-classified nuclear piping. Accepting B31.1 without classification verification is a design control failure.",skills:["Piping Design Standard Selection","Safety Classification","ASME Section III vs B31.1","CSA N286 Design Control"]},
{id:"se10",role:"Systems Engineer",title:"Defence-in-Depth — Ventilation Mod",facility:"Bruce Power Unit 3",year:"2023",difficulty:"Medium",description:"Modification proposes combining ventilation exhaust from a radioactive waste area with general building ventilation. Both currently have independent HEPA filtration. The combined system uses one larger HEPA train with equivalent total capacity.",context:"Defence-in-depth requires independence of safety barriers. Combining independent filtration paths creates a common cause failure vulnerability.",hint:"Is equivalent capacity sufficient when combining two previously independent barriers?",options:[{id:"a",text:"Approve — total HEPA capacity and efficiency are equivalent."},{id:"b",text:"Reject. Combining two independent filtration paths into a single train eliminates independence required by defence-in-depth. A single failure now affects both areas simultaneously."},{id:"c",text:"Approve with conditions: add a redundant HEPA filter in series on the combined train."},{id:"d",text:"Approve and compensate with monthly filter inspections."}],correct:"b",explanation:"Defence-in-depth requires independence of safety barriers — combining previously independent systems violates this regardless of equivalent capacity. Capacity addresses quantity, not independence. Adding a second filter in series does not restore independence of two separate trains.",skills:["Defence-in-Depth Principles","Common Cause Failure","Ventilation System Design","Independence Requirements"]},
{id:"me01",role:"Mechanical Engineer",title:"Pressure Tube Heq Above Criterion",facility:"OPG Darlington Unit 3",year:"2019",difficulty:"Medium",description:"UT inspection reveals a pressure tube with Heq of 48 mg/kg — above the FFS screening criterion of 45 mg/kg. No DHC detected. Tube has been in service 14 years. Return to service planned in 4 days.",context:"The Heq screening criterion in CSA N285.8 is a conservative trigger for detailed assessment — not automatic rejection.",hint:"The screening criterion is a trigger, not a hard limit. What does CSA N285.8's FFS assessment need to demonstrate?",options:[{id:"a",text:"Recommend immediate replacement — operating above the criterion is not permitted."},{id:"b",text:"Perform formal FFS assessment per CSA N285.8. If fracture mechanics margins are adequate with no detected flaws, startup may proceed with enhanced monitoring commitments."},{id:"c",text:"Accept within normal measurement scatter — criterion has built-in conservatism. Proceed with startup."},{id:"d",text:"Defer to CNSC and wait for regulatory direction."}],correct:"b",explanation:"CSA N285.8 is designed for CANDU pressure tube FFS assessments. The screening criterion triggers formal assessment — not rejection. If fracture mechanics margins are adequate, startup may proceed with enhanced monitoring. Option D transfers a licensee responsibility to the regulator.",skills:["CSA N285.8 Fitness-for-Service","Pressure Tube Degradation","Delayed Hydride Cracking","Fracture Mechanics"]},
{id:"me02",role:"Mechanical Engineer",title:"SG Tube Wall Loss Assessment",facility:"Bruce Power Unit 4",year:"2022",difficulty:"Medium",description:"ECT identifies two SG tubes — one at 38% wall loss and one at 35% — both at support plate intersections. Hard plugging criterion is >40%. No leakage detected in the previous operating period.",context:"Both tubes are below the hard plugging criterion, but the integrity program requires projection of wall loss to the next inspection.",hint:"Being below the plugging criterion does not automatically mean acceptable. What additional assessment is required?",options:[{id:"a",text:"Both are below 40% — accept as-is and return to service."},{id:"b",text:"Plug both tubes immediately as conservative measure."},{id:"c",text:"Perform structural integrity assessment. Project wall loss to next inspection using measured degradation rate. Plug now if either tube is projected to exceed 40% before next outage ECT."},{id:"d",text:"Install mechanical plugs in both and schedule review next outage."}],correct:"c",explanation:"The tube integrity program requires a forward-looking assessment. The key question is projected wall loss at the next inspection. If either tube is projected to exceed 40% before the next outage, it must be plugged now. Accepting as-is without projection is non-conservative.",skills:["Steam Generator Tube Integrity","Eddy Current Testing","Structural Integrity Assessment","Degradation Rate Projection"]},
{id:"me03",role:"Mechanical Engineer",title:"Feeder FAC — FFS Calculation",facility:"OPG Pickering Unit 6",year:"2020",difficulty:"Hard",description:"UT shows outlet feeder wall thickness of 4.1mm. Original: 6.35mm. Minimum acceptable: 3.8mm. Previous inspection 3 years ago: 5.2mm. Thinning rate: 0.37mm/year. Next inspection: 3 years away.",context:"FAC is the degradation mechanism. FFS criteria require wall thickness to remain above minimum throughout the inspection interval.",hint:"Calculate projected thickness at next inspection: 4.1 − (0.37 × 3). What does your result tell you?",options:[{id:"a",text:"Current 4.1mm is above 3.8mm — accept and maintain 3-year interval."},{id:"b",text:"Project: 4.1 − (0.37 × 3) = 3.0mm, below 3.8mm minimum. Current interval is not acceptable. Reduce interval or replace feeder before it reaches minimum thickness."},{id:"c",text:"Flag for monitoring but maintain current schedule — rate may decrease."},{id:"d",text:"Immediately shut down for feeder replacement."}],correct:"b",explanation:"Projection: 4.1 − (0.37 × 3) = 3.0mm — below the 3.8mm minimum. The feeder reaches minimum in approximately (4.1−3.8)/0.37 = 0.81 years (~10 months). The 3-year inspection interval is not acceptable. Interval must be reduced to within 10 months or feeder replaced.",skills:["Flow-Accelerated Corrosion","Wall Thickness Calculation","FFS Inspection Interval","CANDU Feeder Management"]},
{id:"me04",role:"Mechanical Engineer",title:"ASME Class 1 Weld Indication",facility:"OPG Darlington — Refurbishment",year:"2021",difficulty:"Hard",description:"Post-weld NDE on a new Class 1 reactor coolant boundary weld finds a linear indication 14mm long — 4mm above the NB-5350 acceptance criterion of 10mm. Weld is on a new feeder end fitting. Replacement costs $240,000 and 3 weeks.",context:"ASME Section III NB-5350 criteria are conservative screening criteria. Article NB-2430 provides an alternative evaluation methodology for criterion exceedances.",hint:"The standard criterion is exceeded — but ASME Section III provides an alternative pathway. What is it?",options:[{id:"a",text:"Accept — only 4mm over criterion and replacement is cost-prohibitive."},{id:"b",text:"Reject immediately and proceed with replacement."},{id:"c",text:"Invoke ASME Section III alternative evaluation (NB-2430). Perform fracture mechanics analysis under design basis loading. Accept or reject based on engineering assessment."},{id:"d",text:"Submit to CNSC — Class 1 weld criterion exceedances require regulatory approval."}],correct:"c",explanation:"ASME NB-5350 criteria are conservative screening criteria. When exceeded, NB-2430 provides the alternative evaluation path using fracture mechanics. This is standard practice — not a regulatory bypass. Accepting based on cost is engineering malpractice.",skills:["ASME Section III NDE","Fracture Mechanics","Alternative Evaluation Methodology","Class 1 Pressure Boundary"]},
{id:"me05",role:"Mechanical Engineer",title:"Seismic Qualification Gap — ECCS Pump",facility:"Bruce Power Unit 5",year:"2022",difficulty:"Medium",description:"A replacement ECCS pump qualification report (IEEE 344) uses a Generic Qualification Spectrum that envelopes the site Required Response Spectrum above 10 Hz. Between 2–8 Hz the GQS is 15% below the RRS at two frequency points.",context:"IEEE 344 requires the qualification spectrum to envelope the RRS at all frequencies.",hint:"The qualification spectrum must fully envelope the RRS. What does a gap at specific frequencies mean for the qualification status?",options:[{id:"a",text:"Accept — deficiency is only 15% at two isolated points."},{id:"b",text:"The pump is not seismically qualified as-submitted. Options: supplementary analysis addressing the 2–8 Hz gap, a compliant alternate pump, or site-specific analysis for the deficient range."},{id:"c",text:"Install the pump and flag the gap as a future action item."},{id:"d",text:"Request the manufacturer to retest at full RRS envelope."}],correct:"b",explanation:"IEEE 344 requires full envelopment of the RRS at all frequencies. A 15% deficiency at 2–8 Hz means the pump has not been demonstrated to withstand site seismic demand in that range. Installing an unqualified safety-critical pump is a safety and regulatory violation.",skills:["IEEE 344 Seismic Qualification","Required Response Spectrum","ECCS Equipment Qualification","Seismic Design Basis"]},
{id:"me06",role:"Mechanical Engineer",title:"Annulus Gas Alarm — Channel 14",facility:"OPG Darlington Unit 2",year:"2023",difficulty:"Medium",description:"Annulus gas monitoring annunciates a CO₂ concentration alarm on Channel 14. CO₂ rising at 0.8%/hour above baseline. Alarm threshold is 0.5% above baseline.",context:"Rising CO₂ in the annulus gas circuit indicates coolant leaking from the pressure tube — one of CANDU's primary early-warning systems for PT leaks.",hint:"This is the annulus gas system functioning as designed. What is the procedurally correct response and when does it become a shutdown trigger?",options:[{id:"a",text:"Monitor and continue operation — the leak rate is very small."},{id:"b",text:"Enter the annulus gas alarm procedure. Confirm signal, identify affected channel, monitor leak rate trend, assess against shutdown criterion. Initiate controlled shutdown if rate exceeds the procedural limit."},{id:"c",text:"Immediately SCRAM — any PT leak requires immediate shutdown."},{id:"d",text:"Isolate the annulus gas circuit for Channel 14 to stop the alarm."}],correct:"b",explanation:"The annulus gas system is functioning correctly. The procedure provides specific leak rate limits. If the rate remains below the shutdown criterion with a stable trend, controlled operation may continue with enhanced monitoring while a shutdown is planned. Isolating the monitoring circuit disables a safety monitoring function.",skills:["Annulus Gas Monitoring","Pressure Tube Leak Detection","CANDU Operating Procedures","Leak-Before-Break"]},
{id:"me07",role:"Mechanical Engineer",title:"Turbine Rotor — Planar Indication",facility:"Bruce Power Unit 1",year:"2021",difficulty:"Hard",description:"UT inspection of the HP rotor disc bore finds a 22mm long volumetric indication with planar characteristics at 45mm depth. Rotor has 180,000 service hours. OEM criterion allows up to 10mm.",context:"Turbine disc bore cracking has caused catastrophic failures at other plants. Planar indications in high-stress bore locations are treated conservatively.",hint:"The indication significantly exceeds OEM criteria and shows planar characteristics. What is the correct engineering disposition process?",options:[{id:"a",text:"Accept — the turbine is non-nuclear and the OEM criterion is likely conservative."},{id:"b",text:"Replace the rotor immediately without further analysis."},{id:"c",text:"Commission a fracture mechanics FFS assessment. Determine critical crack size, fatigue crack growth rate, and remaining life under operational loading. Accept or reject based on the assessment."},{id:"d",text:"Return to service at reduced speed to lower rotational stresses until next outage."}],correct:"c",explanation:"A planar indication exceeding OEM criteria in a turbine bore requires a fracture mechanics FFS assessment determining critical crack size, growth rate, and remaining life. Service history does not validate a criterion exceedance. Speed reduction is not an engineering disposition.",skills:["Turbine Rotor FFS","Fracture Mechanics","Planar Indication Assessment","Fatigue Crack Growth"]},
{id:"me08",role:"Mechanical Engineer",title:"Heat Exchanger — Construction Standard",facility:"CNL Chalk River",year:"2022",difficulty:"Easy",description:"A new HX in the secondary cooling circuit transfers heat from reactor cooling water (low-level radioactive, 85°C, 500 kPa) to non-radioactive service water. Designer specified TEMA Class C.",context:"TEMA Class C is the lightest commercial standard. In nuclear facilities, safety classification drives the required construction standard.",hint:"The primary side contains radioactive fluid. What drives construction standard selection in a nuclear facility?",options:[{id:"a",text:"Accept TEMA Class C — temperature and pressure are low and radioactivity is low-level."},{id:"b",text:"Review safety classification based on radiological consequences of tube failure. If SR or SS, ASME Section III or equivalent CSA standard applies — not TEMA."},{id:"c",text:"Upgrade to TEMA Class R — it is the highest TEMA standard."},{id:"d",text:"Accept TEMA Class C with requirement for more frequent inspection."}],correct:"b",explanation:"Construction standard in a nuclear facility is determined by safety classification — not operating conditions alone. TEMA is an industrial standard not recognised in nuclear safety-classified procurement under CSA N286. Upgrading to TEMA Class R still uses the wrong code family.",skills:["Heat Exchanger Design Standards","TEMA vs ASME Section III","Nuclear Procurement","CSA N286 Design Control"]},
{id:"me09",role:"Mechanical Engineer",title:"Thermal Fatigue — Mixing Tee",facility:"OPG Darlington Unit 1",year:"2023",difficulty:"Hard",description:"An 8mm surface-breaking crack is found at a mixing tee in shutdown cooling piping where cold service water (25°C) meets hot system water (180°C). Crack is in base material adjacent to the weld. Component is Safety Related Class 2.",context:"Thermal fatigue at mixing tees is a documented failure mechanism. OE from other plants indicates accelerated crack growth under certain flow conditions.",hint:"This is a known degradation mechanism with industry OE available. What should you seek before performing your own FFS assessment?",options:[{id:"a",text:"Perform FFS assessment and return to service if margins are acceptable."},{id:"b",text:"Replace the piping section immediately."},{id:"c",text:"Review nuclear industry OE for this mixing tee configuration. Perform FFS incorporating actual plant thermal loading. Assess whether a design modification to eliminate thermal stratification is warranted. Enter in CAP."},{id:"d",text:"Reduce system temperature to eliminate the thermal gradient and monitor at next outage."}],correct:"c",explanation:"Thermal fatigue at mixing tees is well-documented in nuclear OE (NRC Bulletin 88-08, EPRI reports). OE review before or alongside FFS is essential — other plants' experience informs both the assessment and long-term fix. FFS alone misses the improvement opportunity.",skills:["Thermal Fatigue Assessment","Nuclear OE Review","Safety Related Piping","Corrective Action and Long-Term Fix"]},
{id:"me10",role:"Mechanical Engineer",title:"Pressure Relief Valve — Set Point Drift",facility:"Bruce Power Unit 2",year:"2021",difficulty:"Easy",description:"In-service testing finds a safety relief valve lifting at 1,240 kPa — 8% above its set point of 1,150 kPa. Tech Spec criterion allows ±3% drift. System design pressure is 1,300 kPa. Valve not replaced since installation 12 years ago.",context:"Safety relief valves protect pressure boundaries from overpressure. A valve lifting high may not protect the system at design pressure.",hint:"The valve is 8% high — outside ±3% Tech Spec tolerance. What does the exceedance require?",options:[{id:"a",text:"Accept — valve still lifts below 1,300 kPa design pressure so boundary is protected."},{id:"b",text:"Valve fails Tech Spec criterion. Remove for recalibration or replacement. Enter CAP to investigate root cause. Review inspection interval for similar valves."},{id:"c",text:"Adjust set point paperwork to reflect the measured lift pressure."},{id:"d",text:"Continue operating and schedule replacement at next outage."}],correct:"b",explanation:"A Tech Spec criterion exceedance requires immediate action. An 8% high drift means the system could reach pressures between 1,150 and 1,240 kPa without relief valve actuation. CAP entry is required for root cause investigation. Adjusting paperwork is falsification of test records.",skills:["Pressure Relief Valve Testing","Tech Spec Acceptance Criteria","In-Service Testing","Pressure Boundary Protection"]}];

const KNOWLEDGE_CATS=[
{cat:"CANDU Reactor",icon:"⚛️",accent:"#3b82f6",topics:[
{q:"What makes CANDU unique?",a:"Uses heavy water (D₂O) as moderator AND coolant with natural uranium fuel in horizontal pressure tubes. On-power refuelling — no shutdown needed. Positive void coefficient managed by SDS1 & SDS2. Operated by OPG (Darlington, Pickering) and Bruce Power."},
{q:"Fuel channel system details?",a:"380–480 horizontal pressure tubes (Zr-2.5%Nb) per reactor. Coolant D₂O at ~310°C, 10 MPa. Calandria surrounds with low-pressure moderator at ~70°C. Annulus gas system detects PT leaks. CIGAR & IRIS tools for in-service inspection."},
{q:"SDS1 vs SDS2?",a:"SDS1: shutoff rods drop by gravity into the core in <2 sec. SDS2: high-pressure gadolinium nitrate injected into moderator. Both passive-fail-safe, independent, fast-acting. Either can shut down the reactor alone."},
{q:"CANDU thermal-hydraulic limits?",a:"CHF ratio must remain above 1.0 during all design basis events — dryout is the limiting condition. CATHENA and RELAP5 codes model T-H behaviour. Bundle power and coolant flow are the primary operating parameters."},
{q:"What is the annulus gas system?",a:"CO₂ fills the space between pressure tube and calandria tube. Coolant leaking from a PT dissolves into CO₂ — the system monitors and triggers alarms. CANDU's primary early-warning system for PT leaks."}]},
{cat:"Regulatory",icon:"⚖️",accent:"#8b5cf6",topics:[
{q:"CNSC role and NSCA?",a:"Canadian Nuclear Safety Commission regulates under Nuclear Safety and Control Act. Issues licences for construction, operation, decommissioning. REGDOC series defines expectations. Compliance Verification Conferences held with licensees."},
{q:"CSA N286 — 14 elements?",a:"(1) Management System (2) Organization (3) Human Performance (4) Document Control (5) Design Control (6) Procurement Control (7) Inspection & Testing (8) Non-conformance (9) Corrective Actions (10) Assessment (11) Change Management (12) Records (13) Chemical Control (14) Nuclear Criticality Safety."},
{q:"What triggers a USQ?",a:"(1) Probability of an accident increases, (2) consequences of a malfunction increase, (3) margin of safety in tech specs reduces. Confirmed USQ → update safety analysis → CNSC acceptance before implementation."},
{q:"ASME Section III classes?",a:"Class 1: reactor coolant pressure boundary. Class 2: safety-related systems (ECCS, RHR). Class 3: non-safety but important. NCA-1200 defines design responsibility. Class drives material, fabrication, inspection, and testing decisions."},
{q:"What is a Limiting Condition for Operation?",a:"LCO defines minimum equipment operable for continued operation. When entered, the Allowed Outage Time specifies the correction window. Exceeding AOT without restoration requires controlled shutdown. LCOs are managed conditions — not emergencies."}]},
{cat:"Project Mgmt",icon:"📊",accent:"#f59e0b",topics:[
{q:"How is a nuclear outage managed?",a:"Planned every 12–18 months. 10,000+ work orders, 1,000+ contractors. Critical path: PT inspection → SG maintenance → turbine overhaul. Three planning phases: long-range (18 months), mid-range (6 months), short-range (weeks). 10–15% schedule margin protected."},
{q:"Earned Value Management?",a:"BCWS = planned value, BCWP = earned value, ACWP = actual cost. SPI = EV/PV, CPI = EV/AC. Variance thresholds trigger escalation. Standard on major capital projects like Darlington Refurbishment (~$12.8B)."},
{q:"What is the Corrective Action Program?",a:"All deficiencies enter CAP. Priority: Immediate (safety threat), Significant (24–72 hrs), Routine (scheduled). RCA for significant events — Cause Mapping, HPIP, 5-Why. CAP closure is a formal milestone gate."},
{q:"What is a regulatory hold point?",a:"Work must stop until CNSC sign-off is received. Missing a hold point is reportable under NSCA Section 45. All hold points tracked in the modification package and tied to the inspection plan."},
{q:"Nuclear fatigue management?",a:"Workers on safety-significant tasks have max shift lengths and mandatory rest periods. Typically 12 hours max for licensed operators. Fatigue is a formally recognised human performance error precursor. CNSC inspects compliance."}]},
{cat:"Systems Eng",icon:"🔧",accent:"#8b5cf6",topics:[
{q:"Safety classification levels?",a:"Safety Special (SS): direct failure causes nuclear accident. Safety Related (SR): supports SS functions. Non-Safety (NS): no safety function. Classification drives CSA standard, procurement controls, seismic category, inspection frequency, and documentation."},
{q:"Design Basis Accidents?",a:"LOCA: largest DBA, drives ECCS design. LOR: drives shutdown system design. Steam Main Break: drives containment design. Loss of Class IV power: drives emergency power. Safety systems must perform under all DBAs without exceeding SAR acceptance criteria."},
{q:"Single failure criterion?",a:"Safety systems must perform assuming any single active component fails. Requires redundancy — 2-of-3 logic or dual trains. Deterministic, not probabilistic. MTBF ratings do not substitute for structural redundancy."},
{q:"Defence-in-depth?",a:"Five barriers: fuel matrix → sheath → pressure boundary → containment → exclusion zone. Layered independent safety systems. Physical separation of redundant trains. No single failure can disable the safety function."},
{q:"What is a Design Basis Document?",a:"Authoritative source for design parameters used in modifications and safety analyses. Discrepancies between DBD and original calculations must be formally resolved. Years of use do not validate an incorrect value."}]},
{cat:"Mechanical Eng",icon:"⚙️",accent:"#10b981",topics:[
{q:"Pressure tube fitness-for-service?",a:"Zr-2.5%Nb tubes degrade via H/D pickup, creep, and DHC. FFS per CSA N285.8: measure Heq → if above screening criterion → fracture mechanics → demonstrate margins → authorize with enhanced monitoring."},
{q:"Steam generator tube integrity?",a:"SG tubes are primary-to-secondary boundary. ECT each outage. Plugging criterion: >40% wall loss. Structural integrity assessment must project wall loss to next inspection — not just compare today's measurement."},
{q:"Flow-accelerated corrosion?",a:"FAC thins carbon steel feeders — flowing D₂O dissolves the oxide layer. Rate increases with temperature, velocity, lower Cr content. Always project future thickness against FFS minimum. Root cause of Mihama accident (Japan 2004)."},
{q:"Seismic qualification?",a:"Equipment qualified per IEEE 344 and CSA N289. Test spectrum must fully envelop the RRS at ALL frequencies — a gap at any frequency means the equipment is not qualified for that site."},
{q:"Thermal fatigue at mixing tees?",a:"Hot and cold fluid mixing causes thermal fatigue — cyclic stresses from temperature fluctuations. Known failure mechanism per NRC Bulletin 88-08. Planar cracking at weld toes or base material near mixing points. OE review essential before FFS."}]},
{cat:"Safety Culture",icon:"🛡️",accent:"#ec4899",topics:[
{q:"IAEA safety culture attributes?",a:"INSAG-4/INSAG-13: safety as clearly recognized priority, leadership commitment, questioning attitude, rigorous and prudent approach, learning organization. OSART missions assess culture at Canadian plants. Fear of schedule impact suppressing reporting is a serious red flag."},
{q:"Human performance tools?",a:"STAR (Stop, Think, Act, Review). Pre-job briefing: review procedure, identify error-likely situations. 3-way communication: repeat-back. Place-keeping: checkmarks in procedure. Post-job review before crew disperses."},
{q:"Root cause analysis methods?",a:"5-Why: rapid for low-significance. Cause Mapping: systematic for complex events. HPIP: specifically for human error — identifies error precursors. Apollo Method: evidence-based cause trees. Significant events require formal RCA with CNSC reporting."},
{q:"What is a nuclear close call?",a:"An event that could have had a safety-significant consequence — near miss. Non-punitive reporting is a cornerstone of healthy safety culture. CNSC requires reporting under NSCA Section 45. Low CAP entry threshold — all near-misses captured."}]}];

function Pill({label,color}){return <span style={{fontSize:11,padding:"3px 10px",borderRadius:20,background:color+"18",color,fontWeight:600,border:"1px solid "+color+"30",whiteSpace:"nowrap"}}>{label}</span>}
function ScoreRing({score,size}){size=size||54;const r=20,c=2*Math.PI*r,f=score/100*c;
return <svg width={size} height={size} viewBox="0 0 48 48"><circle cx="24" cy="24" r={r} fill="none" stroke="#e2e8f0" strokeWidth="4"/><circle cx="24" cy="24" r={r} fill="none" stroke={sc(score)} strokeWidth="4" strokeDasharray={f+" "+(c-f)} strokeLinecap="round" transform="rotate(-90 24 24)"/><text x="24" y="28" textAnchor="middle" fontSize="10" fontWeight="800" fill={sc(score)}>{score}</text></svg>}
function QRWidget({text,size}){size=size||148;const N=21,g=Array.from({length:N},()=>Array(N).fill(0));
const sf=(r,c)=>{for(let i=0;i<7;i++)for(let j=0;j<7;j++)if(r+i<N&&c+j<N)g[r+i][c+j]=(i===0||i===6||j===0||j===6||(i>=2&&i<=4&&j>=2&&j<=4))?1:0};
sf(0,0);sf(0,14);sf(14,0);for(let i=8;i<13;i++){g[6][i]=i%2===0?1:0;g[i][6]=i%2===0?1:0}g[13][8]=1;
let h=5381;for(let i=0;i<text.length;i++)h=((h<<5)+h)+text.charCodeAt(i)&0xfffffff;let s=h;
const rn=()=>{s=(s*1103515245+12345)&0x7fffffff;return s/0x7fffffff};
for(let r=0;r<N;r++)for(let c=0;c<N;c++){const fin=(r<8&&c<8)||(r<8&&c>=13)||(r>=13&&c<8),tim=r===6||c===6;if(!fin&&!tim)g[r][c]=rn()>0.48?1:0}
const cs=Math.floor(size/(N+2));
return <svg width={cs*(N+2)} height={cs*(N+2)} style={{borderRadius:8,display:"block"}}><rect width="100%" height="100%" fill="white"/>{g.map((row,r)=>row.map((on,c)=>on?<rect key={r+"-"+c} x={(c+1)*cs} y={(r+1)*cs} width={cs} height={cs} fill="#1e1b4b"/>:null))}</svg>}
function LiveAtom({size}){size=size||200;const h=size/2;const p1="M"+h*0.15+" "+h+" a"+h*0.85+" "+h*0.32+" 0 1 1 "+h*1.7+" 0 a"+h*0.85+" "+h*0.32+" 0 1 1 -"+h*1.7+" 0";
const p2="M"+h*0.15+" "+h+" a"+h*0.85+" "+h*0.32+" 0 1 0 "+h*1.7+" 0 a"+h*0.85+" "+h*0.32+" 0 1 0 -"+h*1.7+" 0";
return <svg width={size} height={size} viewBox={"0 0 "+size+" "+size} style={{display:"block"}}>

<ellipse cx={h} cy={h} rx={h*0.85} ry={h*0.32} stroke="rgba(16,185,129,0.4)" strokeWidth="1.5" fill="none" style={{transformOrigin:h+"px "+h+"px",animation:"ao2 11s linear infinite"}}/>
<ellipse cx={h} cy={h} rx={h*0.85} ry={h*0.32} stroke="rgba(245,158,11,0.4)" strokeWidth="1.5" fill="none" style={{transformOrigin:h+"px "+h+"px",animation:"ao3 14s linear infinite"}}/>

:<div style={{animation:"fadeUp .4s ease both"}}>
<div style={{background:selected===scenario.correct?"linear-gradient(135deg,#f0fdf4,#dcfce7)":"linear-gradient(135deg,#fef2f2,#fee2e2)",border:"1.5px solid "+(selected===scenario.correct?"#86efac":"#fca5a5"),borderRadius:12,padding:"1.125rem",marginBottom:"0.875rem"}}>
<p style={{fontWeight:800,marginBottom:"0.5rem",color:selected===scenario.correct?"#15803d":"#b91c1c",fontSize:14}}>{selected===scenario.correct?"✓ Correct decision":"✗ Incorrect — correct answer: "+scenario.correct.toUpperCase()}</p>
<p style={{fontSize:13,lineHeight:1.85,color:selected===scenario.correct?"#166534":"#991b1b"}}>{scenario.explanation}</p></div>

<div style={{display:"flex",flexWrap:"wrap",gap:"0.375rem"}}>{scenario.skills.map((s,i)=><Pill key={s} label={s} color={["#8b5cf6","#10b981","#f59e0b","#ec4899"][i%4]}/>)}</div></div>

<button onClick={()=>startScenario(scenario.role)} style={{padding:"9px 16px",borderRadius:10,border:"1.5px solid #e2e8f0",background:"white",fontSize:13,cursor:"pointer",fontWeight:600,color:"#334155"}}>Next ↺</button>
<button onClick={()=>setSimPhase("role")} style={{padding:"9px 16px",borderRadius:10,border:"1.5px solid #e2e8f0",background:"white",fontSize:13,cursor:"pointer",color:"#334155"}}>Change Role</button></div></div>}</div></div>
<div style={{background:"white",borderRadius:16,border:"1.5px solid #ede9fe",padding:"1.25rem",boxShadow:"0 4px 18px rgba(139,92,246,.08)"}}>

<div className="g2" style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0.5rem"}}>
{[["Solved",portfolio.length,"#8b5cf6"],["Correct",portfolio.filter(e=>e.correct).length+"/"+portfolio.length,"#10b981"],["Avg Score",avg,""],["Skills",allSkills.length,"#ec4899"]].map(([l,v,c])=>
<div key={l} style={{background:"#f8fafc",borderRadius:8,padding:"0.5rem 0.75rem",border:"1px solid #e2e8f0"}}>
<div style={{fontSize:9,color:"#94a3b8",textTransform:"uppercase",letterSpacing:".06em"}}>{l}</div>
<div style={{fontSize:16,fontWeight:800,color:l==="Avg Score"&&avg?sc(avg):(c||"#1e293b")}}>{String(v)}</div></div>)}</div></div></div>}
<div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(150px,1fr))",gap:"0.875rem",marginBottom:"1.5rem"}}>
{[{l:"Solved",v:portfolio.length,c:"#8b5cf6",g:"linear-gradient(135deg,#f5f3ff,#ede9fe)"},{l:"Avg Score",v:avg,c:sc(avg||0),g:"linear-gradient(135deg,#f0fdf4,#dcfce7)"},{l:"Correct",v:portfolio.filter(e=>e.correct).length+"/"+portfolio.length,c:"#10b981",g:"linear-gradient(135deg,#ecfdf5,#d1fae5)"},{l:"Skills",v:allSkills.length,c:"#ec4899",g:"linear-gradient(135deg,#fdf2f8,#fce7f3)"}].map(m=>
<div key={m.l} className="ch" style={{background:m.g,borderRadius:14,border:"1px solid "+m.c+"20",padding:"1.125rem",boxShadow:"0 3px 12px "+m.c+"10"}}>
<div style={{fontSize:9,color:"#94a3b8",textTransform:"uppercase",letterSpacing:".08em",marginBottom:"0.375rem"}}>{m.l}</div>
<div style={{fontSize:26,fontWeight:800,color:m.c}}>{String(m.v)}</div></div>)}</div>
<div style={{display:"flex",flexDirection:"column",gap:"0.875rem",marginBottom:"1.375rem"}}>
{portfolio.map((e,idx)=>{const isOpen=expanded===e.uid,rm=RM[e.role];
return <div key={e.uid||idx} style={{background:"white",borderRadius:16,border:"1.5px solid "+(isOpen?rm.color+"38":"#e2e8f0"),overflow:"hidden",boxShadow:isOpen?"0 10px 32px "+rm.color+"14":"0 2px 8px rgba(0,0,0,.04)"}}>

<div style={{display:"flex",gap:"0.875rem",alignItems:"flex-start",flex:1}}>
<div style={{width:44,height:44,borderRadius:12,background:rm.grad,display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,flexShrink:0}}>{rm.icon}</div>
<div style={{flex:1}}>
<div style={{display:"flex",alignItems:"center",gap:7,marginBottom:"0.35rem",flexWrap:"wrap"}}>
<span style={{fontWeight:800,fontSize:14,color:"#1e293b"}}>{e.title}</span>
<span style={{fontSize:11,padding:"2px 8px",borderRadius:20,background:e.correct?"#f0fdf4":"#fef2f2",color:e.correct?"#16a34a":"#dc2626",fontWeight:700,border:"1px solid "+(e.correct?"#86efac":"#fca5a5")}}>{e.correct?"✓":"✗"}</span>
{e.hintUsed&&<span style={{fontSize:10,color:"#94a3b8",border:"1px solid #e2e8f0",padding:"1px 7px",borderRadius:20}}>hint</span>}</div>

<div style={{display:"flex",flexWrap:"wrap",gap:"0.3rem"}}>{(e.skills||[]).slice(0,3).map((s,i)=><Pill key={s} label={s} color={["#8b5cf6","#10b981","#f59e0b"][i%3]}/>)}
{(e.skills||[]).length>3&&<span style={{fontSize:10,color:"#94a3b8",alignSelf:"center"}}>+{e.skills.length-3}</span>}</div></div></div>
<div style={{display:"flex",alignItems:"center",gap:8,flexShrink:0}}><ScoreRing score={e.score} size={48}/>
<span style={{color:"#cbd5e1",fontSize:16,transform:isOpen?"rotate(90deg)":"none"}}>›</span></div></div></button>
{isOpen&&<div style={{borderTop:"1px solid #f1f5f9",background:"#fafafa",padding:"1.375rem",animation:"fadeUp .3s ease both"}}>

<p style={{fontSize:13,lineHeight:1.8,color:"#334155"}}>{e.description}</p></div>
<div style={{background:"#f5f3ff",borderRadius:10,padding:"1rem",border:"1px solid #ede9fe"}}>

{(e.options||[]).map(opt=>{const isC=opt.id===e.correct,isCh=opt.id===e.selectedOption;

<span style={{fontSize:12,lineHeight:1.65,color:tc,flex:1}}>{opt.text}</span>
{isC&&<span style={{fontSize:10,color:"#16a34a",fontWeight:800,flexShrink:0}}>✓ Correct</span>}
{isCh&&!isC&&<span style={{fontSize:10,color:"#dc2626",fontWeight:700,flexShrink:0}}>Your answer</span>}</div>})}</div></div>
<div style={{background:e.correct?"linear-gradient(135deg,#f0fdf4,white)":"linear-gradient(135deg,#fef2f2,white)",borderRadius:12,padding:"1rem 1.125rem",border:"1.5px solid "+(e.correct?"#86efac":"#fca5a5")}}>
<p style={{fontSize:10,fontWeight:700,color:e.correct?"#16a34a":"#dc2626",textTransform:"uppercase",letterSpacing:".08em",marginBottom:"0.5rem"}}>Expert Analysis</p>
<p style={{fontSize:13,lineHeight:1.85,color:"#334155"}}>{e.explanation}</p></div></div>}</div>})}</div>

<div style={{display:"flex",flexWrap:"wrap",gap:"0.4rem"}}>{allSkills.map((s,i)=><Pill key={s} label={s} color={["#8b5cf6","#10b981","#f59e0b","#ec4899","#3b82f6","#f43f5e"][i%6]}/>)}</div></div>}</div>}
